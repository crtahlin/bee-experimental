## Bee configuration - https://docs.ethswarm.org/docs/working-with-bee/configuration

## allow to advertise private CIDRs to the public network
# allow-private-cidrs: false
## HTTP API listen address
# api-addr: 127.0.0.1:1633
## chain block time
# block-time: "5"
## block number cache sync interval in blocks
# block-sync-interval: 10
## blockchain rpc configuration
##
## endpoint accepts one value or a list. With more than one the node fails over
## between them in the order given, so a provider outage stops being a node
## outage. A single endpoint behaves exactly as before.
##
##   endpoint:
##     - https://primary.example/rpc
##     - https://standby.example/rpc
##
## Reads fail over. Sending a transaction does not: a lost response may mean the
## first endpoint accepted it, so retrying elsewhere risks a duplicate. All
## endpoints must be on the same chain; the node refuses to start otherwise.
# blockchain-rpc:
#   endpoint: ""
#   dial-timeout: 30s
#   tls-timeout: 10s
#   idle-timeout: 90s
#   keepalive: 30s
## initial nodes to connect to
# bootnode: ["/dnsaddr/mainnet.ethswarm.org"]
## chunk loads the reserve sampler keeps in flight.
##
## Sampling loads chunks from disk and hashes them. Those are separate pools:
## loading is disk-bound, hashing is CPU-bound. This sets the loading side.
##
## 0 uses the default, which matches the CPU count and behaves as it did when
## the two were one pool. Raising it offers the storage layer more concurrent
## reads, which helps only if the disk has headroom; on a contended disk it
## queues instead. Lowering it under-drives the disk and lengthens sampling,
## which risks missing a redistribution round.
##
## The sample itself does not change with this setting, whatever it is set to.
# sampler-read-concurrency: 0
## chunks the reserve sampler buffers and sorts into disk order before reading.
##
## Reads are issued in bin order, which comes from the chunk address and so says
## nothing about where the data sits on disk. Every read is a seek to an
## unrelated position. Buffering a window and sorting it by physical position
## shortens those seeks.
##
## 0 reads in bin order, which is what the sampler did before ordering existed.
## A non-zero value costs one extra index lookup per chunk, for a key read
## moments earlier and so served from cache. Worth setting on a seek-bound disk;
## on an SSD the seeks it removes were cheap and the extra lookup may not pay
## for itself. Values above 1048576 are capped.
##
## The sample itself does not change with this setting, whatever it is set to.
# sampler-sort-window: 0
## reserve lookups pullsync may have in flight at once.
##
## pullsync asks the reserve whether it already holds a chunk once per offered
## chunk, from one goroutine per syncing peer. The concurrency the reserve sees
## is therefore the peer count, and on a node with a hundred peers and a large
## reserve that is a hundred index lookups competing with everything else the
## store is doing.
##
## 0 leaves them unbounded, which is the previous behaviour. A bound trades
## contention for queueing, so it can be set too tight: watch
## bee_localstore_reserve_has_wait_duration, and if the wait is a meaningful
## share of the lookup itself, the bound is costing more than it saves.
# reserve-has-concurrency: 0
## connected peers per bin below which the bin is not considered saturated.
##
## 0 uses the default of 8.
##
## Read the warning on the next setting before changing either: this is not a
## local decision.
# kademlia-saturation-peers: 0
## connected peers per bin above which the bin is over-saturated and further
## peers are pruned.
##
## 0 uses the default of 18.
##
## RAISING THIS SPENDS OTHER NODES' RESOURCES, NOT ONLY YOURS. Every extra
## connection this node keeps is a connection slot occupied on a peer, and that
## peer's limits were chosen by its own operator. A node that raises its limits
## takes a larger share of the neighbourhood's connection budget, and the cost
## lands on the neighbourhood rather than on whoever set the number.
##
## The gain is more sync sources and a denser routing table. Whether that is
## worth the cost is a question about the neighbourhood, not about this node,
## and it has not been measured. Leave it alone unless you are measuring it.
# kademlia-over-saturation-peers: 0
## log lines that may wait to be written before further lines are dropped.
##
## Bee writes its log to standard output, which under systemd, Docker or a
## desktop launcher is a pipe. If whatever reads that pipe stops, the write
## blocks, and because the code that connects to peers also logs, the node
## stops dialling and never recovers. It keeps answering its API and reporting
## healthy while holding zero peers.
##
## Buffering means a stalled log reader costs log lines instead. When the
## reader catches up, a "dropped N log lines" notice is written so the gap is
## visible.
##
## 0 writes synchronously, which is the older behaviour and lets a stalled
## reader block the node. Only set it if you have a reason.
# log-sink-buffer: 4096
## per-peer inbound chunk rate this node will serve, in chunks per second.
##
## 0 uses the default of 250. This is a fairness and stability choice, not a
## hardware limit: with eight peers it caps a reserve fill at roughly 2,000
## chunks/s, so filling 4.19 million chunks takes about half an hour at best,
## and doubling reserve capacity doubles that.
##
## Raising it asks more of your peers and of your own disk; lowering it makes
## you a slower source for others. It does not change what any other node does.
# pullsync-max-chunks-per-second: 0
## total inbound sync rate across all peers, in chunks per second.
##
## 0 uses the default of 1000, roughly 4 MB/s. Raising it only helps if peers
## can actually supply more — confirm the limit is the binding constraint
## before changing it, or the change does nothing.
# puller-max-chunks-per-second: 0
## how often the puller re-decides which peers to sync from.
##
## 0 uses the default of 5m. After a radius change the puller can wait up to
## this long before syncing follows the new radius, which slows reserve filling
## and matters more the larger the reserve.
##
## Shortening it costs reserve lookup pressure, because each recalculation asks
## the reserve about peers — see issue #20 before lowering it much.
# pullsync-recalc-interval: 0
## how long the reserve worker waits between runs.
##
## 0 uses the default of 15m. Each run scans the reserve, so at larger reserve
## sizes the scan grows while this interval does not, and the node spends an
## increasing share of its time scanning.
# reserve-wakeup-duration: 0
## cause the node to always accept incoming connections
# bootnode-mode: false
## bzz token contract address
# bzz-token-address: ""
## cache capacity in chunks, multiply by 4096 to get approximate capacity in bytes
# cache-capacity: "1000000"
## enable forwarded content caching
# cache-retrieval: true
## enable chequebook
# chequebook-enable: true
## reject full-node hive/handshake records that carry no chequebook address
# chequebook-verification: false
## config file (default is $HOME/.bee.yaml)
config: "/etc/bee/bee.yaml"
## origins with CORS headers enabled
# cors-allowed-origins: []
## data directory
data-dir: "/var/lib/bee"
## usable size of the database block cache in bytes. With the pebble engine the
## default 33554432 becomes 67108864 (64 MiB), and Pebble's cache is that plus
## what memtables reserve from it, 3 x db-write-buffer-size: 160 MiB by default.
## Without that room a grown memtable leaves no cache for the index filters and
## reserve samples slow down several times. The cache and memtables cost up to
## about twice their size in memory.
# db-block-cache-capacity: "33554432"
## disables db compactions triggered by seeks
# db-disable-seeks-compaction: true
## number of open files allowed by database
# db-open-files-limit: "200"
## size of the database write buffer in bytes
# db-write-buffer-size: "33554432"
## cause the node to start in full mode
# full-node: false
## help for printconfig
# help: false
## triggers connect to main net bootnodes.
# mainnet: true
## minimum gas tip cap in wei for transactions, 0 means use suggested gas tip cap
# minimum-gas-tip-cap: 0
## minimum radius storage threshold
# minimum-storage-radius: "0"
## NAT exposed address, as host:port. Behind a port-forwarding NAT whose public
## IP can change, and which sends and receives through the same public IP, use
## ":<port>" (for example ":1634"): the node then advertises the public IP its
## peers observe on that port and follows it when it changes. An IP here is
## advertised as written, and a warning is logged if peers observe another one.
## A DNS name is advertised as a name that peers resolve when they dial.
# nat-addr: ""
## suggester for target neighborhood
# neighborhood-suggester: https://api.swarmscan.io/v1/network/neighborhoods/suggestion
## ID of the Swarm network
# network-id: "1"
## P2P listen address
# p2p-addr: :1634
## enable P2P WebSocket transport
# p2p-ws-enable: false
## password for decrypting keys
# password: ""
## path to a file that contains password for decrypting keys
password-file: "/var/lib/bee/password"
## percentage below the peers payment threshold when we initiate settlement
# payment-early-percent: 50
## threshold in BZZ where you expect to get paid from your peers
# payment-threshold: "13500000"
## excess debt above payment threshold in percentages where you disconnect from your peer
# payment-tolerance-percent: 25
## postage stamp contract address
# postage-stamp-address: ""
## postage stamp contract start block number
# postage-stamp-start-block: "0"
## enable pprof mutex profile
# pprof-mutex: false
## enable pprof block profile
# pprof-profile: false
## price oracle contract address
# price-oracle-address: ""
## redistribution contract address
# redistribution-address: ""
## reserve capacity doubling
# reserve-capacity-doubling: 0
## ENS compatible API endpoint for a TLD and with contract address, can be repeated, format [tld:][contract-addr@]url
# resolver-options: []
## forces the node to resync postage contract data
# resync: false
## skip postage snapshot
# skip-postage-snapshot: false
## staking contract address
# staking-address: ""
## lru memory caching capacity in number of statestore entries
# statestore-cache-capacity: "100000"
## protect nodes from getting kicked out on bootnode
# static-nodes: []
## enable storage incentives feature
# storage-incentives-enable: true
## enable swap
# swap-enable: false
## swap factory addresses
# swap-factory-address: ""
## initial deposit if deploying a new chequebook
# swap-initial-deposit: "0"
## neighborhood to target in binary format (ex: 111111001) for mining the initial overlay
# target-neighborhood: ""
## tracing settings
# tracing:
#   ## enable tracing
#   enable: false
#   ## OTLP collector endpoint to send tracing data (host:port); default port is 4318 for http, 4317 for grpc
#   endpoint: 127.0.0.1:4318
#   ## disable TLS for the OTLP exporter (useful for a local collector)
#   insecure: false
#   ## path to a PEM-encoded CA bundle used to verify the OTLP collector certificate; ignored when insecure is true
#   ca-file: ""
#   ## OTLP exporter transport: http or grpc
#   protocol: http
#   ## head-based sampling ratio in [0,1]; 0 samples nothing, 1 samples everything
#   sampling-ratio: 1.0
#   ## service name identifier for tracing
#   service-name: bee
## gas limit fallback when estimation fails for contract transactions (default 500000)
# gas-limit-fallback: 500000
## skips the gas estimate step for contract transactions
# transaction-debug-mode: false
## log verbosity level 0=silent, 1=error, 2=warn, 3=info, 4=debug, 5=trace
# verbosity: info
## maximum node warmup duration; proceeds when stable or after this time
# warmup-time: 5m0s
## send a welcome message string during handshakes
# welcome-message: ""
## withdrawal target addresses
# withdrawal-addresses-whitelist: []
## enable wss p2p connections (default: false)
# p2p-wss-enable: false
## wss address (default: :1635)
# p2p-wss-addr: :1635
## WSS NAT exposed address
# nat-wss-addr: ""
## autotls domain (default: libp2p.direct)
# autotls-domain: ""
## autotls registration endpoint (default: https://registration.libp2p.direct)
# autotls-registration-endpoint: ""
## autotls ca endpoint (default: https://acme-v02.api.letsencrypt.org/directory)
# autotls-ca-endpoint: ""
# Use the SIMD BMT hasher. Leave this commented out: unset means "enable it
# where the CPU supports it", which is linux/amd64 with AVX2 or AVX-512, and
# off everywhere else. Measured on an AVX2 machine: 25% off reserve-sample
# wall clock.
#
# Setting it explicitly is strict. true on hardware without AVX2 refuses to
# start, rather than quietly falling back, so that asking for it means being
# sure of it. Set false to keep the pure-Go path on capable hardware.
# use-simd-hashing: false
## stake recovery from retired staking contracts. off (the default, do nothing),
## withdraw (recover it to the node's wallet), or migrate (recover it into the
## current staking contract). It moves staked funds, so it is opt-in.
##
## QUOTE IT. YAML reads a bare off, on, yes or no as a BOOLEAN, so
##
##   stake-recovery-on-startup: off
##
## reaches the node as "false". That is accepted as off, but the quoted form is
## what makes the file say what it means, and an unquoted "on" is not a valid
## mode at all because it does not say withdraw or migrate.
# stake-recovery-on-startup: "off"

## the redistribution reserve-size proof. classic is the whole-reserve proof
## upstream uses and the live contract verifies. windowed is EXPERIMENTAL and is
## not what the live contract verifies, so leave this alone on a node that holds
## stake.
# reserve-proof-mode: "classic"

## index store engine, pebble or leveldb. A data directory is BOUND to the
## engine it was created with, so this only takes effect on a fresh one and
## changing it later means a new data directory and a full resync, not a
## restart. Unset means pebble for a fresh directory and whatever an existing
## directory already uses.
# storage-engine: "pebble"

## limit of possible connected light nodes (default: 100)
# light-node-limit: 100

## light-node slots that ultra-light peers (light peers without a chequebook)
## may take; 0 means the same as light-node-limit, and a larger value is
## reduced to it. Raising it lets clients that cannot pay take more of the
## node's free bandwidth and handshakes; lowering it refuses such clients
## sooner and sends them to other nodes, while paying light peers keep their
## slots
# ultra-light-node-limit: 0
