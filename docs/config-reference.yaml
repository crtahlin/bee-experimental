# wasp / Bee — annotated configuration reference
#
# Every option this build accepts, grouped and documented. Generated from
# `bee start --help`, so it matches the flags exactly — no stale or missing
# options. Each entry shows its help and default; uncomment and change to set.
# The same names work as CLI flags (--name) and environment variables (BEE_NAME).
#
# This fork installs to /etc/bee/bee.yaml, the same path as upstream.
# Regenerate after adding a flag: `bee start --help` is the source of truth.

# ========================================================================
# Node identity and data
# ========================================================================

## cache capacity in chunks, multiply by 4096 to get approximate capacity in
## bytes
# cache-capacity: 1000000

## data directory
# data-dir: "~/.bee"

## password for decrypting keys
# password: ""

## path to a file that contains password for decrypting keys
# password-file: ""

# ========================================================================
# HTTP API and debug
# ========================================================================

## HTTP API listen address
# api-addr: "127.0.0.1:1633"

## origins with CORS headers enabled
# cors-allowed-origins: []

# ========================================================================
# Networking and peering
# ========================================================================

## allow to advertise private CIDRs to the public network
# allow-private-cidrs: false

## autotls certificate authority endpoint
# autotls-ca-endpoint: "https://acme-v02.api.letsencrypt.org/directory"

## autotls domain
# autotls-domain: "libp2p.direct"

## autotls registration endpoint
# autotls-registration-endpoint: "https://registration.libp2p.direct"

## initial nodes to connect to
# bootnode: []

## cause the node to always accept incoming connections
# bootnode-mode: false

## cause the node to start in full mode
# full-node: false

## triggers connect to main net bootnodes.
# mainnet: true

## NAT exposed address.
## A node behind NAT now stabilises its advertised address automatically: it learns
## its public address from peers and holds it steady, so peers see one stable address
## instead of a new one per connection. Setting nat-addr still works and overrides
## the automatic behaviour with a fixed address. If a node ever sits at zero peers
## while dialling, the signal of the old failure is the handshake_address_minted_total
## metric climbing roughly one per connection. See issue #221.
# nat-addr: ""

## WSS NAT exposed address
# nat-wss-addr: ""

## ID of the Swarm network
# network-id: 1

## P2P listen address
# p2p-addr: ":1634"

## new connections accepted at once from one IPv4 address or one IPv6 /56
## subnet above the per-second rate; 0 uses the default of 40. Raising it lets
## one address open more connections at once; lowering it can refuse the
## reconnects of a restarting peer, or of users behind a shared carrier NAT,
## who then wait or try other nodes
# p2p-connection-burst-per-ip: 40

## new connections per second accepted from one IPv4 address or one IPv6 /56
## subnet; 0 uses the default of 10. Raising it lets one address open
## connections faster and spend more of this node's handshakes; lowering it
## slows the reconnects of peers that share one address behind a carrier NAT,
## who then wait or try other nodes
# p2p-connection-rate-per-ip: 10

## new inbound connections the node accepts at once above
## p2p-inbound-connection-rate, per bucket; 0 uses the default of 200, -1 turns
## the limit off, other negative values are refused. Raising it lets a larger
## flood through before the rate applies; lowering it can refuse the peers that
## reconnect at once after a restart, who then wait or go to other nodes
# p2p-inbound-connection-burst: 200

## new inbound connections per second the node accepts in total, checked after
## the per-IP limits and before the security handshake, in each of two buckets:
## full peers that completed a handshake with this node, and every other
## address; 0 uses the default of 30, -1 turns the limit off, other negative
## values are refused; off on a bootnode unless set. Raising it lets more
## connection setups through under a flood, which costs this node CPU and takes
## it from its reserve samples; lowering it makes new light clients wait or go
## to other nodes, can make new full peers drop this node from their address
## books after 4 refused dials, and can make other nodes, and this node itself,
## judge it unreachable
# p2p-inbound-connection-rate: 30

## open connections accepted from one IPv4 address or one IPv6 /56 subnet; 0
## uses the default of 200. Raising it lets one address hold more of this
## node's connections, handshakes and light slots; lowering it can refuse users
## who share one address behind a carrier NAT, who must then use other nodes
# p2p-max-connections-per-ip: 200

## enable P2P WebSocket transport
# p2p-ws-enable: false

## p2p wss address
# p2p-wss-addr: ":1635"

## Enable Secure WebSocket P2P connections
# p2p-wss-enable: false

## ENS compatible API endpoint for a TLD and with contract address, can be
## repeated, format [tld:][contract-addr@]url
# resolver-options: []

## send a welcome message string during handshakes
# welcome-message: ""

# ========================================================================
# Blockchain, swap and incentives
# ========================================================================

## block number cache sync interval in blocks
# block-sync-interval: 10

## chain block time in seconds; if set, used as is; if unset, the network default is used until the node has measured the chain's block time
# block-time: 5

## blockchain rpc TCP dial timeout
# blockchain-rpc-dial-timeout: 30s

## rpc blockchain endpoint; repeat or list several for failover, in priority
## order
# blockchain-rpc-endpoint: []

## blockchain rpc idle connection timeout
# blockchain-rpc-idle-timeout: 1m30s

## blockchain rpc TCP keepalive interval
# blockchain-rpc-keepalive: 30s

## blockchain rpc TLS handshake timeout
# blockchain-rpc-tls-timeout: 10s

## bzz token contract address
# bzz-token-address: ""

## enable chequebook
# chequebook-enable: true

## minimum chequebook token balance required for verification, in token small
## units
# chequebook-min-balance: "11 BZZ) (default "110000000000000000""

## reject full-node hive/handshake records that carry no chequebook address
# chequebook-verification: false

## postage stamp contract address
# postage-stamp-address: ""

## price oracle contract address
# price-oracle-address: ""

## redistribution contract address
# redistribution-address: ""

## staking contract address
# staking-address: ""

## recover stake left in retired staking contracts when the node starts
## (issue #256): "off" (default, do nothing), "withdraw" (recover it to the
## node's wallet), or "migrate" (recover it into the current staking contract).
## It moves staked funds, so it is off by default and acts only on this explicit
## opt-in. If the node has no native balance for gas or the chain is unreachable,
## it is skipped and retried on the next start, never blocking startup; a
## part-finished migrate resumes where it left off. Discover recoverable stake
## first, without moving anything, with GET /stake/legacy.
# stake-recovery-on-startup: "off"

## enable storage incentives feature
# storage-incentives-enable: true

## enable swap
# swap-enable: false

## swap factory addresses
# swap-factory-address: ""

## initial deposit if deploying a new chequebook
# swap-initial-deposit: "0"

## skips the gas estimate step for contract transactions
# transaction-debug-mode: false

## withdrawal target addresses
# withdrawal-addresses-whitelist: []

# ========================================================================
# Storage engine and index-store tuning
#
# The reserve's index store. storage-engine chooses the engine for a NEW
# data directory (pebble is the default since issue #185; goleveldb stays
# selectable with "leveldb", and an existing goleveldb store keeps goleveldb).
# The db-* options tune whichever engine is active; the level-0 triggers gate
# writes under compaction pressure. See docs/agent-playbooks/test-bench.md.
# ========================================================================

## usable size of the database block cache in bytes. This caches the index
## store's blocks, not chunk data, which the operating system page cache serves.
##
## With the pebble engine the default 33554432 becomes 67108864 (64 MiB) of
## usable cache, and Pebble's cache is sized as that plus what its memtables
## reserve from it: (MemTableStopWritesThreshold + 1) x db-write-buffer-size, which
## is 3 x 32 MiB by default, so 160 MiB in total. Pebble charges every memtable,
## including one being flushed and one kept for reuse, against its block cache.
## Without this room, a grown memtable leaves the cache unable to hold the filter
## blocks a reserve sample reads, and the sample runs several times slower
## (issue #555).
## Any value other than 33554432 is used as the usable size, so set 33554431 for
## a deliberately small cache.
##
## Raising it costs memory: this build keeps the cache and the memtables on the
## Go heap, so up to about twice their size in resident memory, taken from the
## page cache that serves chunk reads. Lowering the usable size below about 1 MiB
## per cache shard brings the slow samples back. With goleveldb the value is the
## block cache as before and the default stays 33554432; a node measurement found
## no reserve-sample speedup from raising it there (issue #12).
# db-block-cache-capacity: 33554432

## level-0 SST files at which the index store starts compacting; lower
## compacts sooner and more often (more write amplification), higher lets
## level 0 grow (more read amplification on the sampling path); 0 means the
## goleveldb default of 4. The 8 shown here is the goleveldb-oriented default.
## Pebble keeps level 0 shallow (a threshold of 4) on its own, which is what
## keeps the reserve-sample read fast (issue #198), and only a value other than
## 8 overrides that, so leave this unset for pebble unless a measurement on a
## real node says otherwise.
# db-compaction-l0-trigger: 8

## disables db compactions triggered by seeks
# db-disable-seeks-compaction: true

## number of open files allowed by database
# db-open-files-limit: 200

## size of the database write buffer in bytes
# db-write-buffer-size: 33554432

## level-0 SST files at which the index store blocks writes until compaction
## catches up; raising it buys burst headroom before a stall but allows more
## level-0 files and so more read amplification, lowering it stalls sooner; 0
## means the goleveldb default of 12
# db-write-pause-trigger: 12

## level-0 SST files at which the index store slows writes by 1ms each to let
## compaction catch up; 0 means the goleveldb default of 8
# db-write-slowdown-trigger: 8

## index-store engine for a NEW data directory: "pebble" (the recommended
## engine and the default since issue #185) or "leveldb". Empty uses the engine
## the data directory was created with, and pebble for a fresh one. This is
## backwards compatible: an existing goleveldb store, including a data directory
## created by upstream bee, keeps goleveldb automatically, so dropping in this
## binary needs no flag and no migration. The two on-disk formats are not
## interchangeable, so a directory is bound to its engine; switch only by
## starting a fresh data directory. See issue #185.
# storage-engine: ""

## redistribution reserve-size proof. "classic" (the default) is the
## whole-reserve scan that upstream bee uses and that the live redistribution
## contract verifies. "windowed" is an experimental sublinear proof, a windowed
## order statistic that reads only a fraction of the reserve (issue #271). It is
## EXPERIMENTAL and does NOT win on the live network: the deployed contract only
## accepts the classic proof, so a node in windowed mode produces a proof the
## contract rejects and earns nothing, no matter how many nodes run it. Use it
## only on a testnet or for research; leave unset for classic. See issue #273.
# reserve-proof-mode: "classic"

## reserve size in chunks. 0 (the default) uses 4194304 (1<<22). This sets the
## base that reserve-capacity-doubling multiplies, so the two compose. Lower it to
## size the reserve to a smaller disk, raise it to hold more; the node's storage
## radius follows (it deepens when over capacity, shallows when well under). A
## value below 4096 is rejected. See issue #283.
# reserve-capacity: 0

# ========================================================================
# Reserve and sync
#
# The reserve worker and pull-sync. reserve-wakeup-duration and the sync-
# rate limits are the levers for how much background work a large-reserve
# node does.
# ========================================================================

## minimum radius storage threshold
# minimum-storage-radius: 0

## total inbound sync rate across all peers, in chunks per second; 0 uses the
## default of 1000, roughly 4 MB/s. Raising it fills a large reserve faster but
## draws more serving bandwidth from the peers you sync from, a cost paid by them.
## Keep the default unless you run a large-reserve node that needs it. This is the
## rate that gates reserve fill; the saturation peer count is not (see issue #32).
# puller-max-chunks-per-second: 0

## rate this node serves to each peer pulling from it, in chunks per second; 0 uses
## the default of 250. Raising it lets peers pull from you faster at the cost of
## your own upload bandwidth; lowering it makes you a slower source for the network.
# pullsync-max-chunks-per-second: 0

## how often the puller re-decides which peers to sync from; 0 uses the
## default of 5m
# pullsync-recalc-interval: 0

## reserve capacity doubling
# reserve-capacity-doubling: 0

## reserve lookups pullsync may have in flight at once; 0 leaves them
## unbounded, which is the previous behaviour
# reserve-has-concurrency: 0

## how long the reserve worker waits between runs; 0 uses the default of 15m
# reserve-wakeup-duration: 0

## how often the reserve reconciles chunks against their batches and evicts
## orphans; 0 runs it on every wake-up (the default). A longer interval keeps the
## frequent wake-up scan to the cheap within-radius count; it delays repairing the
## divergence case the sweep exists for, bounded by the interval
# reserve-batch-sweep-interval: 0

## use SIMD BMT hasher; unset means enable it where the CPU supports it
## (linux/amd64 with AVX2 or AVX-512). Setting it explicitly is strict: true
## on unsupported hardware refuses to start
# use-simd-hashing: false

# ========================================================================
# Logging and tracing
# ========================================================================

## path to a PEM-encoded CA bundle used to verify the OTLP collector
## certificate; ignored when --tracing-insecure=true
# tracing-ca-file: ""

## enable tracing
# tracing-enable: false

## OTLP collector endpoint to send tracing data (host:port); default port is
## 4318 for http, 4317 for grpc
# tracing-endpoint: "127.0.0.1:4318"

## disable TLS for the OTLP exporter (useful for a local collector); when
## false, set --tracing-ca-file to verify the collector certificate against a
## private CA
# tracing-insecure: false

## OTLP exporter transport: http or grpc
# tracing-protocol: "http"

## head-based sampling ratio in [0,1]; 0 samples nothing, 1 samples
## everything
# tracing-sampling-ratio: 1

## service name identifier for tracing
# tracing-service-name: "bee"

## log verbosity level 0=silent, 1=error, 2=warn, 3=info, 4=debug, 5=trace
# verbosity: "info"

# ========================================================================
# Other
# ========================================================================

## enable forwarded content caching
# cache-retrieval: true

## config file
# config: "is $HOME/.bee.yaml"

## gas limit fallback when estimation fails for contract transactions
# gas-limit-fallback: 500000

## help for start
# help: false

## connected peers per bin above which the bin is over-saturated and further
## peers are pruned; 0 uses the default of 18. Raising it consumes other
## nodes' connection budget, not only your own
# kademlia-over-saturation-peers: 0

## connected peers per bin below which the bin is not considered saturated; 0
## uses the default of 8. Raising it consumes other nodes' connection budget,
## not only your own
# kademlia-saturation-peers: 0

## light node limit
# light-node-limit: 100

## log lines that may wait to be written before further lines are dropped; 0
## writes synchronously, which lets a stalled log reader block the node
# log-sink-buffer: 4096

## minimum gas tip cap in wei for transactions, 0 means use suggested gas tip
## cap
# minimum-gas-tip-cap: 0

## suggester for target neighborhood
# neighborhood-suggester: "https://api.swarmscan.io/v1/network/neighborhoods/suggestion"

## percentage below the peers payment threshold when we initiate settlement
# payment-early-percent: 50

## threshold in BZZ where you expect to get paid from your peers
# payment-threshold: "13500000"

## excess debt above payment threshold in percentages where you disconnect
## from your peer
# payment-tolerance-percent: 25

## blocks behind the chain head that postage events must be before they are
## applied, from 1 to 64; raising it delays seeing stamp events and pauses
## postage syncing once by the difference, lowering it risks applying events
## from blocks that are rolled back
# postage-confirmation-depth: 4

## stop the node once its batch store has been stale this long, counted from
## when it became stale (10 minutes after the last postage page applied), with
## exit status 75; 0 never stops: a stale node stays up, serves content, holds
## chunks of batches it has not seen yet and sits out lottery rounds until it
## catches up. A duration takes the node off the network while stale and adds
## restart load to a host that may already be overloaded
# postage-stall-shutdown: 0s

## postage stamp contract start block number
# postage-stamp-start-block: 0

## enable pprof mutex profile
# pprof-mutex: false

## enable pprof block profile
# pprof-profile: false

## content providers: announce pinned content through /wasp/providers, look up
## providers for larger downloads, honor the Wasp-Providers download header,
## and answer local-only requests from peers. Off by default. Announcing costs
## stamp slots and publishes which content this node holds; lookups cost extra
## retrievals, some of them unpaid work for the nodes that forward them. See
## docs/experiments/content-providers/spec.md
# providers-enable: false

## how the refresh allowance raises a peer's overdraft limit inside the first
## second after a refreshment: step (default, grants nothing until a full
## second has elapsed and then a whole refresh rate, which is Bee's behavior)
## or continuous (accrues per millisecond, capped below what the peer
## tolerates). Any other value is refused at startup.
##
## Raising it to continuous costs this node nothing directly and cannot make it
## owe more than the ceiling it can already reach, but it costs other nodes a
## larger unsecured debt outstanding inside the first second of each refresh
## cycle, up to the tolerance they already permit, and it risks this node being
## blocklisted where the cap is wrong for a peer. The cap assumes the peer runs
## the same payment-tolerance-percent as this node, because a peer announces a
## threshold but not its tolerance. Leaving it at step costs the refusals
## measured in issue #353, if those refusals turn out to cost delivered bytes.
##
## Not yet measured. See docs/experiments/content-providers/continuous-accrual.md
# refresh-allowance-accrual: step

## forces the node to resync postage contract data
# resync: false

## chunk loads the reserve sampler keeps in flight; 0 uses the default, which
## matches the CPU count and preserves previous behaviour
# sampler-read-concurrency: 0

## chunks the reserve sampler buffers and sorts into disk order before
## reading; 0 reads in bin order, which is the previous behaviour
# sampler-sort-window: 0

## skip postage snapshot
# skip-postage-snapshot: false

## lru memory caching capacity in number of statestore entries
# statestore-cache-capacity: 100000

## protect nodes from getting kicked out on bootnode
# static-nodes: []

## neighborhood to target in binary format (ex: 111111001) for mining the
## initial overlay
# target-neighborhood: ""

## light-node slots that ultra-light peers (light peers without a chequebook)
## may take; 0 means the same as light-node-limit, and a larger value is
## reduced to it. Raising it lets clients that cannot pay take more of the
## node's free bandwidth and handshakes; lowering it refuses such clients
## sooner and sends them to other nodes, while paying light peers keep their
## slots
# ultra-light-node-limit: 0

## maximum node warmup duration; proceeds when stable or after this time
# warmup-time: 5m0s
