        "500":
          $ref: "SwarmCommon.yaml#/components/responses/500"
        default:
          description: Default response

  "/wasp/ingest":
    post:
      summary: "Store content locally without postage (wasp)"
      description: "Stores content in this node's own store, with no postage and without pushing anything to the network. By default the request body is split into chunks as POST /bytes does, and the reference is identical to the one a stamped POST /bytes of the same bytes at the same redundancy level returns. With Swarm-Collection set the body is a tar or multipart archive and is stored as a collection with its manifest, so a directory or website can be hosted without postage, and the manifest root equals the one a stamped POST /bzz of the same archive returns on the same node. Unlike POST /bzz, a collection is selected by that header alone and never by the content type, so an archive posted without it is stored as a single blob. Manifest chunks count against local-ingest-limit, and for many small files they are most of the cost. This is not an upload: no other node holds the content, so it is reachable only by a requester that names this node with the Wasp-Providers header, and it is not replicated, so losing this node loses the content. The content is stored as an ordinary pinning collection and is removed with DELETE /pins/{reference}. An encrypted ingest cannot be announced through /wasp/providers, which refuses encrypted references. Answers 403 unless the node runs with local-ingest-enable, and 507 at local-ingest-limit."
      tags:
        - Local ingest
      parameters:
        - in: header
          schema:
            $ref: "SwarmCommon.yaml#/components/parameters/SwarmEncryptParameter"
          name: swarm-encrypt
          required: false
        - in: header
          schema:
            $ref: "SwarmCommon.yaml#/components/parameters/SwarmRedundancyLevelParameter"
          name: swarm-redundancy-level
          required: false
          description: "Redundancy level. Defaults to the upload default, as POST /bytes does, not the download default that pinning uses."
        - $ref: "SwarmCommon.yaml#/components/parameters/SwarmCollection"
        - $ref: "SwarmCommon.yaml#/components/parameters/SwarmIndexDocumentParameter"
        - $ref: "SwarmCommon.yaml#/components/parameters/SwarmErrorDocumentParameter"
        - in: header
          schema:
            $ref: "SwarmCommon.yaml#/components/parameters/SwarmPostageBatchId"
          name: swarm-postage-batch-id
          required: false
          description: "When present, the stored reference is announced in the same request, as POST /wasp/providers/{reference} does. The batch stamps only the provider record, never the content. For a collection the manifest root is announced. Refused before the body is read with 403 when providers-enable is off, and with 400 on a light node or with swarm-encrypt."
      requestBody:
        description: "Content to store. A single blob by default, or a tar or multipart archive when Swarm-Collection is set."
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/x-tar:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference:
                    $ref: "SwarmCommon.yaml#/components/schemas/SwarmReference"
                  chunks:
                    type: integer
                    format: int64
                    description: Distinct chunks stored, which is what counts against local-ingest-limit
                  soleSource:
                    type: boolean
                    description: "True when no other node held this content at the moment of ingest. It stops being true once anyone retrieves it, because a forwarding peer caches what it relays."
                  announced:
                    type: boolean
                    description: "Present only when swarm-postage-batch-id was sent. Whether the announcement succeeded. A failed announcement does not fail the ingest: the content is stored and can be announced later with POST /wasp/providers/{reference}."
                  announceError:
                    type: string
                    description: "Why the announcement failed, with the message POST /wasp/providers/{reference} would give. Present only when announced is false."
        "200":
          description: Already held by this node; nothing was stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference:
                    $ref: "SwarmCommon.yaml#/components/schemas/SwarmReference"
                  chunks:
                    type: integer
                    format: int64
                  soleSource:
                    type: boolean
                  announced:
                    type: boolean
                  announceError:
                    type: string
        "400":
          $ref: "SwarmCommon.yaml#/components/responses/400"
        "403":
          description: Local ingest is off, or swarm-postage-batch-id was sent and content providers are off
        "500":
          $ref: "SwarmCommon.yaml#/components/responses/500"
        "507":
          description: Local ingest limit reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  held:
                    type: integer
                    format: int64
                    description: Chunks currently held from local ingests
                  limit:
                    type: integer
                    format: int64
        default:
          description: Default response

  "/wasp/providers/{reference}":
    post:
      summary: "Announce pinned content (wasp)"
      description: "Announces that this node provides the referenced content, which must be pinned first with POST /pins/{reference}. The node writes a provider record and a pointer entry for each 12-hour window, stamped from the given batch; the content itself is not stamped. Full nodes only. Answers 403 unless the node runs with providers-enable."
      tags:
        - Providers
      parameters:
        - in: path
          name: reference
          schema:
            $ref: "SwarmCommon.yaml#/components/schemas/SwarmReference"
          required: true
          description: Root hash of pinned content
        - in: header
          schema:
            $ref: "SwarmCommon.yaml#/components/parameters/SwarmPostageBatchId"
          name: swarm-postage-batch-id
          required: true
          description: Postage batch that stamps the provider records
      responses:
        "201":
          description: Announced
        "400":
          $ref: "SwarmCommon.yaml#/components/responses/400"
        "403":
          description: Content providers are off
        "404":
          $ref: "SwarmCommon.yaml#/components/responses/404"
        "422":
          description: Batch not usable yet or does not exist
        "500":
          $ref: "SwarmCommon.yaml#/components/responses/500"
        default:
          description: Default response
    delete:
      summary: "Stop announcing content (wasp)"
      description: "Stops announcing the reference. The node stays listed until the last 12-hour window it wrote ends. The pin stays."
      tags:
        - Providers
      parameters:
        - in: path
          name: reference
          schema:
            $ref: "SwarmCommon.yaml#/components/schemas/SwarmReference"
          required: true
      responses:
        "200":
          description: OK
        "403":
          description: Content providers are off
        "500":
          $ref: "SwarmCommon.yaml#/components/responses/500"
        default:
          description: Default response

  "/wasp/providers/{reference}/lookup":
    get:
      summary: "Look up providers of content (wasp)"
      description: "Reads the pointer index of the reference for the current 12-hour window and returns the providers whose records verify. Answers 403 unless the node runs with providers-enable."
      tags:
        - Providers
      parameters:
        - in: path
          name: reference
          schema:
            $ref: "SwarmCommon.yaml#/components/schemas/SwarmReference"
          required: true
      responses:
        "200":
          description: The verified providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        overlay:
                          type: string
                          description: Overlay address of the provider
                        underlays:
                          type: array
                          items:
                            type: string
                          description: Network addresses the provider signed into its record
                        owner:
                          type: string
                          description: Ethereum address that owns the record
                        capability:
                          type: string
                          enum: [full, partial]
        "403":
          description: Content providers are off
        "500":
          $ref: "SwarmCommon.yaml#/components/responses/500"
        default:
          description: Default response

