  "/readiness":
    get:
      summary: Check if the node is ready to accept traffic
      description: >-
        A node is ready when startup and warmup have completed **and** it has at
        least one connected peer.


        Wasp divergence from stock Bee: stock reports `ready` based on the
        startup probe alone, which is never lowered when connectivity is lost
        afterwards. A node that loses all its peers therefore keeps reporting
        `ready` while it can neither serve nor retrieve anything. Wasp requires
        a connected peer, so an isolated node is visible to any operator or
        orchestrator polling this endpoint.


        Callers that want liveness rather than readiness should use `/health`,
        which is unchanged and reports whether the process is running.
      tags:
        - Status
      responses:
        "200":
          description: Indicates that node is ready
          $ref: "SwarmCommon.yaml#/components/responses/200"
        "400":
          description: Indicates that node is not ready, including when it has no connected peers
          $ref: "SwarmCommon.yaml#/components/responses/400"
        default:
          description: Default response

